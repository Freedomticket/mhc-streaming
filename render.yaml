          type: redis
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://mhc-streaming.onrender.com
      - key: ALLOWED_ORIGINS
